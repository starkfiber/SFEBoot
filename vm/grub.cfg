set timeout=-1
set default=0
terminal_output console
menuentry "Master USB - Alpine Linux 3.24.3 installer" --id alpine-3.24.3 {
  echo "MASTER_USB_SELECTED=alpine-3.24.3"
  linux /boot/vmlinuz-virt modules=loop,squashfs,sd-mod,usb-storage console=tty0 console=ttyAMA0 alpine_repo=/media/cdrom/apks modloop=/media/cdrom/boot/modloop-virt master_usb_entry=alpine-3.24.3
  initrd /boot/initramfs-virt
}
menuentry "Master USB - Alpine Linux 3.23.7 installer" --id alpine-3.23.7 {
  echo "MASTER_USB_SELECTED=alpine-3.23.7"
  linux /versions/3.23.7/boot/vmlinuz-virt modules=loop,squashfs,sd-mod,usb-storage console=tty0 console=ttyAMA0 alpine_repo=/media/cdrom/versions/3.23.7/apks modloop=/media/cdrom/versions/3.23.7/boot/modloop-virt master_usb_entry=alpine-3.23.7
  initrd /versions/3.23.7/boot/initramfs-virt
}
